# git-cliff configuration for CHANGELOG.md and GitHub Release notes. See RELEASING in README.md.

[changelog]
header = """
# Changelog

All notable changes to Huntsman. Versions follow [Semantic Versioning](https://semver.org), and each release is
published as `ghcr.io/tulipfarm/huntsman:<version>`.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/TulipFarm/huntsman/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
postprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/TulipFarm/huntsman/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^build\\(deps\\)", group = "<!-- 5 -->Dependencies" },
  { message = "^(build|ci)", group = "<!-- 4 -->Build and CI" },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]

[bump]
# Before 1.0, features and breaking changes bump the minor version.
features_always_bump_minor = true
breaking_always_bump_major = false
