name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Tests with Lightpanda
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
      - name: Runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: huntsman:ci

  # Packages the Linux archive and installs it the way users do.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: shellcheck packaging/huntsman.sh site/public/install.sh scripts/package.sh
      - run: scripts/package.sh ci linux-amd64
      - name: Install, scrape, uninstall
        run: |
          HUNTSMAN_RELEASE_URL="file://$PWD/dist" sh site/public/install.sh
          ~/.local/bin/huntsman status
          curl -fsS http://127.0.0.1:8080/v1/scrape -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}' | grep -q 'Example Domain'
          ~/.local/bin/huntsman uninstall
          test ! -e ~/.huntsman

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m py_compile dataset/eval.py dataset/huntsman-v1/pipeline/*.py
      - run: bash -n dataset/huntsman-v1/pipeline/run.sh
