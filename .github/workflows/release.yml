name: Release

# Started from a laptop with `make release` (scripts/release.sh). One run checks that main passed CI, picks the
# version from the commits, writes CHANGELOG.md, runs the Docker tests, publishes the images, pushes the release
# commit and tag, and creates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. auto reads the commits (feat → minor before 1.0, fix → patch)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Exact version, such as 1.2.3. Overrides bump
        required: false
        default: ""
      sha:
        description: The main commit you previewed. The release stops if main has moved since
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tulipfarm/huntsman

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$head" ]; then
            echo "::error::main moved from ${EXPECTED_SHA} to ${head} after the preview. Run the release again."
            exit 1
          fi
          # Release commits are pushed with the workflow token, which doesn't trigger CI, so check the last code commit.
          code=$(git log -1 --format=%H --invert-grep --grep='^chore(release):' HEAD)
          passed=$(gh run list --workflow ci.yml --commit "$code" --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length')
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed on ${code}."
            exit 1
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - id: version
        name: Version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$VERSION" ]; then
            if ! [[ "${VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version ${VERSION} is not X.Y.Z."
              exit 1
            fi
            tag="v${VERSION#v}"
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
              echo "::error::${tag} is not newer than ${latest}."
              exit 1
            fi
          else
            tag=$(git cliff --bump "$BUMP" --bumped-version)
          fi
          if [ "$tag" = "$latest" ] || [ -z "$(git log --format=%H --invert-grep --grep='^chore(release):' ${latest:+$latest..}HEAD)" ]; then
            echo "::error::Nothing to release since ${latest}."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (previous: ${latest:-none})"
      - id: commit
        name: Changelog, release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git cliff --tag "$TAG" --output CHANGELOG.md
          git cliff --tag "$TAG" --unreleased --strip all --output "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit --quiet --message "chore(release): ${TAG}"
          git tag --annotate "$TAG" --message "Huntsman ${TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tests with Lightpanda
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Huntsman
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://github.com/TulipFarm/huntsman
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      # Images go out before the tag: if a later step fails, no tag exists, and running the release again rebuilds
      # the same version.
      - id: build
        name: Publish images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Push release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          # The heading repeats the release title, so drop it.
          sed -i '1{/^## /d}' "$notes"
          cat >> "$notes" <<EOF

          ### Container image

          \`\`\`sh
          docker pull ${IMAGE}:${version}
          \`\`\`

          Platforms \`linux/amd64\` and \`linux/arm64\`. Digest: \`${DIGEST}\`
          EOF
          gh release create "$TAG" --verify-tag --title "Huntsman ${TAG}" --notes-file "$notes"
          {
            echo "Released [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo
            echo "Image \`${IMAGE}@${DIGEST}\`"
            while read -r t; do echo "- \`${t}\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
