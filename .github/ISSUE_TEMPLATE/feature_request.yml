name: Feature request
description: Suggest an improvement or a missing Firecrawl-compatible option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour or API you would like. Link the Firecrawl docs if it mirrors a Firecrawl option.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
